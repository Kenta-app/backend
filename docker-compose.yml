services:
  postgres:
    image: postgres:16-bookworm
    container_name: kenta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kenta}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-kenta}
    command: ["python", "scripts/migrate_auth_verification.py"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kenta-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-kenta}
      FAKENEWS_MODEL_DIR: /app/output/fakenews_xlmroberta_full_v1/best_model
      STANCE_MODEL_DIR: /app/output/stance_mbert_weighted_paper/best_model
      SUMMARIZER_MODEL_NAME: ${SUMMARIZER_MODEL_NAME:-ELiRF/mt5-base-dacsa-es}
      SUMMARY_INLINE_ENABLED: ${SUMMARY_INLINE_ENABLED:-false}
      SUMMARY_MAX_CONCURRENT_GENERATIONS: ${SUMMARY_MAX_CONCURRENT_GENERATIONS:-1}
      SUMMARY_NUM_BEAMS: ${SUMMARY_NUM_BEAMS:-4}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      SCRAPING_SCHEDULE_HOUR: ${SCRAPING_SCHEDULE_HOUR:-18}
      SCRAPING_SCHEDULE_MINUTE: ${SCRAPING_SCHEDULE_MINUTE:-58}
      SCRAPER_MAX_ARTICLES_PER_SOURCE: ${SCRAPER_MAX_ARTICLES_PER_SOURCE:-10}
      ML_WARMUP_ON_STARTUP: ${ML_WARMUP_ON_STARTUP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JUSTIFICATION_AUTO_ENABLED: ${JUSTIFICATION_AUTO_ENABLED:-false}
      JUSTIFICATION_MODEL: ${JUSTIFICATION_MODEL:-gemini-2.5-flash}
      JUSTIFICATION_MAX_SOURCES: ${JUSTIFICATION_MAX_SOURCES:-4}
      JUSTIFICATION_CACHE_TTL: ${JUSTIFICATION_CACHE_TTL:-3600}
      JUSTIFICATION_MAX_RETRIES: ${JUSTIFICATION_MAX_RETRIES:-3}
      JUSTIFICATION_RETRY_DELAY: ${JUSTIFICATION_RETRY_DELAY:-2}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      TWITTER_MAX_RESULTS: ${TWITTER_MAX_RESULTS:-10}
      TWITTER_SEARCH_QUERY: ${TWITTER_SEARCH_QUERY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Kenta <verificacion@ikenta.app>}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:-}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-10}
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      EMAIL_VERIFICATION_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    volumes:
      - ./output:/app/output:ro
      - ./data:/app/data:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: ${FRONTEND_API_PROXY_TARGET:-https://api.ikenta.app}
    container_name: kenta-frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: ${FRONTEND_API_PROXY_TARGET:-https://api.ikenta.app}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname):3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: kenta-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/${NGINX_CONFIG_FILE:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - ./docker/certbot/www:/var/www/certbot
      - ./docker/certbot/conf:/etc/letsencrypt

  summary-backfill:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - jobs
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-kenta}
      FAKENEWS_MODEL_DIR: /app/output/fakenews_xlmroberta_full_v1/best_model
      STANCE_MODEL_DIR: /app/output/stance_mbert_weighted_paper/best_model
      SUMMARIZER_MODEL_NAME: ${SUMMARIZER_MODEL_NAME:-ELiRF/mt5-base-dacsa-es}
      SUMMARY_MAX_CONCURRENT_GENERATIONS: ${SUMMARY_MAX_CONCURRENT_GENERATIONS:-1}
      SUMMARY_NUM_BEAMS: ${SUMMARY_NUM_BEAMS:-4}
    command:
      ["python", "scripts/backfill_summaries.py", "--limit", "${SUMMARY_BACKFILL_LIMIT:-20}"]
    volumes:
      - ./output:/app/output:ro
      - ./data:/app/data:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

  news-images-backfill:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - jobs
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-kenta}
    command: ["python", "scripts/backfill_news_images.py", "--apply"]
    depends_on:
      postgres:
        condition: service_healthy

  related-sources:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - jobs
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-kenta}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      JUSTIFICATION_MODEL: ${JUSTIFICATION_MODEL:-gemini-2.5-flash}
      JUSTIFICATION_MAX_SOURCES: ${JUSTIFICATION_MAX_SOURCES:-4}
      JUSTIFICATION_CACHE_TTL: ${JUSTIFICATION_CACHE_TTL:-3600}
      JUSTIFICATION_MAX_RETRIES: ${JUSTIFICATION_MAX_RETRIES:-3}
      JUSTIFICATION_RETRY_DELAY: ${JUSTIFICATION_RETRY_DELAY:-2}
    command:
      [
        "python",
        "scripts/generate_related_sources.py",
        "--limit",
        "${RELATED_SOURCES_LIMIT:-20}",
        "--sleep",
        "${RELATED_SOURCES_SLEEP:-2}",
      ]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  hf_cache:
